<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Θεόδωρος Μαλάκος - Crypto Portfolio</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', 'Poppins', sans-serif; }
        body { background: linear-gradient(135deg, #071217 0%, #0a2027 100%); min-height: 100vh; padding: 20px; display: flex; justify-content: center; align-items: center; }
        .dashboard { max-width: 1480px; width: 100%; background: rgba(6, 20, 24, 0.7); backdrop-filter: blur(4px); border-radius: 56px; padding: 28px 30px 34px; border: 1px solid rgba(255, 200, 100, 0.25); }
        .hero { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-bottom: 30px; border-bottom: 2px solid rgba(255, 196, 0, 0.4); padding-bottom: 20px; gap: 15px; }
        .title-section h1 { font-size: 2.2rem; background: linear-gradient(125deg, #FFE6B0, #FFBC5E); -webkit-background-clip: text; background-clip: text; color: transparent; display: flex; align-items: center; gap: 12px; }
        .title-section p { color: #b8e6e6; font-weight: 500; }
        .live-badge-big { background: #dd4422cc; border-radius: 40px; padding: 5px 14px; font-size: 0.7rem; font-weight: bold; color: white; animation: pulse 1.2s infinite; }
        @keyframes pulse { 0% { opacity: 0.6; } 100% { opacity: 1; } }
        .btc-wallet { background: linear-gradient(135deg, #f7931a, #e67e22); border: none; border-radius: 60px; padding: 10px 24px; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: all 0.25s; font-weight: bold; color: #1a1f2b; }
        .btc-wallet i { font-size: 1.4rem; color: #FFD700; }
        .btc-wallet:hover { transform: scale(1.02); }
        .total-value { background: #0b262e; padding: 12px 32px; border-radius: 70px; text-align: center; border: 1px solid #ffdd99aa; }
        .total-value .label { color: #FFE1A0; font-size: 0.85rem; letter-spacing: 1.5px; }
        .total-value .amount { font-size: 2.4rem; font-weight: 800; color: #FFD966; }
        .stocks-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 22px; margin: 30px 0 35px 0; }
        .stock-card { background: rgba(8, 28, 32, 0.9); border-radius: 36px; padding: 20px; border: 1px solid rgba(255, 200, 80, 0.3); color: #FFEFCF; }
        .stock-name { font-weight: 800; font-size: 1.2rem; color: #FFF6E5; }
        .stock-ticker { color: #ffdd99; background: #00000066; padding: 4px 10px; border-radius: 40px; font-size: 0.7rem; }
        .stock-price { font-size: 2rem; font-weight: 800; color: #FFEFCF; margin: 10px 0; }
        .price-change { font-size: 0.85rem; font-weight: 700; display: inline-block; padding: 4px 12px; border-radius: 32px; }
        .positive { color: #6effb0; background: #1f543f70; }
        .negative { color: #ffae9a; background: #632e2670; }
        .stock-value { color: #bcd3d3; margin-top: 16px; border-top: 1px dashed #ffd96666; padding-top: 12px; display: flex; justify-content: space-between; }
        .value-num { color: #FFE2A4; font-weight: bold; }
        .chart-container { background: #071e24c2; border-radius: 40px; padding: 20px; margin-top: 12px; }
        .chart-header h3 { color: #FEE2B5; }
        canvas { max-height: 380px; width: 100%; background: #031116; border-radius: 28px; }
        button { background: #2a5544; border: none; padding: 10px 24px; border-radius: 60px; color: #FFEFCF; cursor: pointer; font-weight: bold; }
        button:hover { background: #427b64; }
        footer { text-align: center; margin-top: 32px; font-size: 0.7rem; color: #7ea5a5; }
        
        /* Παράθυρο ειδοποίησης (toast notification) */
        .notification-toast {
            position: fixed;
            top: 30px;
            right: 30px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            padding: 16px 28px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 1.1rem;
            z-index: 2000;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideInRight 0.5s ease, fadeOut 0.5s ease 3s forwards;
            border-left: 6px solid #FFD700;
        }
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes fadeOut {
            to { opacity: 0; visibility: hidden; }
        }
        
        /* Bitcoin Modal */
        .bitcoin-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #0e2a2f;
            border-radius: 32px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            border: 2px solid #f7931a;
        }
        .modal-content h3 { color: #FFE6AA; margin-bottom: 15px; }
        .modal-content input {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            background: #1e3a3f;
            border: 1px solid #ffd966;
            border-radius: 12px;
            color: #FFE6AA;
            font-family: monospace;
            font-size: 0.8rem;
        }
        .close-modal { background: #f7931a; color: #1a1f2b; margin-top: 10px; }
    </style>
</head>
<body>
<div class="dashboard">
    <div class="hero">
        <div class="title-section">
            <h1><i class="fas fa-rocket"></i> Θεόδωρος Μαλάκος <span class="live-badge-big"><i class="fas fa-waveform"></i> LIVE</span></h1>
            <p><i class="fas fa-charging-station"></i> Δυναμικό χαρτοφυλάκιο | 2.520€ - 2.795€</p>
        </div>
        <div style="display: flex; gap: 12px; align-items: center;">
            <button id="btcWalletBtn" class="btc-wallet">
                <i class="fab fa-bitcoin"></i> BTC Πορτοφόλι
                <span id="btcStatus"><i class="fab fa-bitcoin"></i> BTC</span>
            </button>
            <div class="total-value">
                <div class="label">ΣΥΝΟΛΙΚΗ ΑΞΙΑ</div>
                <div class="amount" id="totalPortfolioValue">2.520,00 €</div>
            </div>
        </div>
    </div>
    <div class="stocks-grid" id="stocksGrid"></div>
    <div class="chart-container">
        <div class="chart-header" style="display: flex; justify-content: space-between; margin-bottom: 20px;">
            <h3><i class="fas fa-chart-line"></i> Ιστορικό Τιμών [Malakos Data enters]</h3>
            <button id="resetStocksBtn"><i class="fas fa-arrows-rotate"></i> RESET</button>
        </div>
        <canvas id="priceChart"></canvas>
        <p style="color:#b9dbdb; font-size:12px; margin-top: 16px; text-align:center;">τιμές ανεβοκατεβαίνουν απότομα 🔁</p>
    </div>
    <footer><i class="fab fa-github"></i> Θεόδωρος Μαλάκος | Bitcoin address αλλάζει από τον κώδικα</footer>
</div>

<script>
    // ============================================
    // 🔧 ΑΛΛΑΞΕ ΤΟ ΠΑΡΑΚΑΤΩ BITCOIN ADDRESS ΕΔΩ 🔧
    // ============================================
    let currentBTCAddress = "bc1qxy2kgdygjrsqtzq2n0yrf2493p83kkfjhx0wlh";
    // ============================================
    
    // ΜΕΤΟΧΕΣ
    const stocksData = [
        { id: 0, name: "Crypto Dynamics", ticker: "CRP.DYN", shares: 45, price: 14.20, initialPrice: 14.20 },
        { id: 1, name: "Crypto Light", ticker: "CRP.LGT", shares: 32, price: 19.73, initialPrice: 19.73 },
        { id: 2, name: "Omega AI Corp", ticker: "OMG.AI", shares: 28, price: 22.33, initialPrice: 22.33 },
        { id: 3, name: "Hellenic Gold", ticker: "HLG.GR", shares: 55, price: 11.38, initialPrice: 11.38 }
    ];

    function calcTotalValue() { return stocksData.reduce((sum, s) => sum + s.shares * s.price, 0); }
    
    function renderStockCards() {
        const container = document.getElementById('stocksGrid');
        container.innerHTML = stocksData.map(s => {
            const changePercent = ((s.price - s.initialPrice) / s.initialPrice * 100).toFixed(2);
            const isPositive = changePercent >= 0;
            const arrow = isPositive ? '▲' : '▼';
            return `<div class="stock-card">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span class="stock-name">${s.name}</span>
                    <span class="stock-ticker">${s.ticker}</span>
                </div>
                <div class="stock-price">${s.price.toFixed(3)} €</div>
                <div class="price-change ${isPositive ? 'positive' : 'negative'}">${arrow} ${Math.abs(changePercent)}%</div>
                <div class="stock-value">
                    <span class="value-label">Μερίδια: ${s.shares}</span>
                    <span class="value-num">Αξία: ${(s.shares * s.price).toFixed(2)} €</span>
                </div>
            </div>`;
        }).join('');
    }
    
    function updateTotalDisplay() { 
        document.getElementById('totalPortfolioValue').innerHTML = calcTotalValue().toFixed(2) + ' €'; 
    }

    // ΓΡΑΦΗΜΑ
    let priceHistory = [], stockChart;
    const MAX_HISTORY = 30;
    
    function initChart() {
        priceHistory = Array(MAX_HISTORY).fill(stocksData[0].price);
        const ctx = document.getElementById('priceChart').getContext('2d');
        stockChart = new Chart(ctx, {
            type: 'line', 
            data: { 
                labels: Array(MAX_HISTORY).fill().map((_,i)=>`-${MAX_HISTORY-i}`), 
                datasets: [{ 
                    label: 'Crypto Dynamics (€)', 
                    data: priceHistory, 
                    borderColor: '#FFAA44', 
                    borderWidth: 3, 
                    fill: true,
                    backgroundColor: 'rgba(255, 170, 68, 0.1)'
                }] 
            },
            options: { responsive: true }
        });
    }
    
    function addChartPoint(price) { 
        priceHistory.push(price); 
        if(priceHistory.length > MAX_HISTORY) priceHistory.shift(); 
        if(stockChart) {
            stockChart.data.datasets[0].data = priceHistory; 
            stockChart.update(); 
        }
    }

    // ΔΙΑΚΥΜΑΝΣΕΙΣ
    let interval;
    function fluctuate() {
        stocksData.forEach(s => { let change = (Math.random() * 9) - 3.5; s.price = Math.max(0.9, Math.min(48, s.price * (1 + change / 100))); });
        let total = calcTotalValue();
        if (total < 2520) stocksData.forEach(s => s.price *= 2530 / total);
        if (total > 2795) stocksData.forEach(s => s.price *= 2785 / total);
        renderStockCards(); 
        updateTotalDisplay(); 
        addChartPoint(stocksData[0].price);
    }
    
    function startFluctuation() { 
        if(interval) clearInterval(interval); 
        interval = setInterval(fluctuate, 1200); 
    }
    
    function resetTo2520() { 
        stocksData.forEach((s,i) => { 
            s.price = [14.20,19.73,22.33,11.38][i]; 
            s.initialPrice = s.price; 
        }); 
        priceHistory = Array(MAX_HISTORY).fill(stocksData[0].price); 
        if(stockChart) stockChart.data.datasets[0].data = priceHistory; 
        if(stockChart) stockChart.update(); 
        renderStockCards(); 
        updateTotalDisplay(); 
    }

    // ΕΜΦΑΝΙΣΗ ΠΑΡΑΘΥΡΟΥ ΕΝΗΜΕΡΩΣΗΣ
    function showUpdateNotification() {
        const notification = document.createElement('div');
        notification.className = 'notification-toast';
        notification.innerHTML = `
            <i class="fas fa-check-circle" style="font-size: 1.5rem;"></i>
            <span>✅ ΕΓΙΝΕ ΕΝΗΜΕΡΩΣΗ!</span>
            <i class="fas fa-bitcoin" style="font-size: 1.2rem;"></i>
        `;
        document.body.appendChild(notification);
        
        // Αυτόματη αφαίρεση μετά από 3.5 δευτερόλεπτα
        setTimeout(() => {
            if(notification && notification.remove) notification.remove();
        }, 3500);
    }
    
    // Bitcoin Modal
    function showBitcoinModal() {
        const modal = document.createElement('div');
        modal.className = 'bitcoin-modal';
        modal.innerHTML = `
            <div class="modal-content">
                <i class="fab fa-bitcoin" style="font-size:48px;color:#f7931a;"></i>
                <h3>Bitcoin Address</h3>
                <input type="text" id="btcAddressInput" readonly value="${currentBTCAddress}" onclick="this.select();document.execCommand('copy')">
                <p style="color:#b9dbdb;font-size:12px;">👆 Κλικ για αντιγραφή</p>
                <p style="color:#ffaa66;font-size:11px;">Αλλάξτε το address μέσα στον κώδικα (HTML)</p>
                <button class="close-modal" onclick="this.closest('.bitcoin-modal').remove()">Κλείσιμο</button>
            </div>
        `;
        document.body.appendChild(modal);
    }
    
    // ΕΛΕΓΧΟΣ ΑΝ ΕΓΙΝΕ ΑΛΛΑΓΗ ΣΤΟ ADDRESS (μέσω localStorage)
    function checkForAddressUpdate() {
        const storedAddress = localStorage.getItem('btc_address_backup');
        if (storedAddress && storedAddress !== currentBTCAddress) {
            // Βρέθηκε διαφορά! Εμφάνισε το notification
            showUpdateNotification();
        }
        // Αποθήκευση του τρέχοντος address για μελλοντική σύγκριση
        localStorage.setItem('btc_address_backup', currentBTCAddress);
    }
    
    // ΕΝΗΜΕΡΩΣΗ του status κουμπιού
    document.getElementById('btcStatus').innerHTML = '<i class="fab fa-bitcoin"></i> BTC';
    
    // Σύνδεση events
    document.getElementById('btcWalletBtn').addEventListener('click', () => showBitcoinModal());
    document.getElementById('resetStocksBtn').addEventListener('click', () => resetTo2520());
    
    // Εκκίνηση όλων
    initChart();
    startFluctuation();
    renderStockCards();
    updateTotalDisplay();
    
    // Έλεγχος για ενημέρωση address και εμφάνιση notification
    checkForAddressUpdate();
    
    // Επιπλέον: κάθε φορά που φορτώνει η σελίδα, δείχνει notification
    // (αυτό σημαίνει ότι μετά από commit στο GitHub, ο χρήστης βλέπει το μήνυμα)
    showUpdateNotification();
</script>
</body>
</html>
